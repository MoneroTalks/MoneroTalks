<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — MoneroTalks</title>
  <style>
    :root { --orange:#ff6600; --ink:#161616; --mute:#5c5c5c; --line:#e6e6e6; --paper:#f3efe8; --card:#fff; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Georgia,"Times New Roman",serif; background:var(--paper); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; }
    header { background:#fffcf7; border-top:3px solid var(--orange); border-bottom:1px solid var(--line); padding:.9rem 1.5rem; }
    .bar { display:flex; align-items:center; justify-content:space-between; max-width:44rem; margin:0 auto; gap:1rem; }
    .brand { display:flex; align-items:center; gap:.75rem; text-decoration:none; color:inherit; }
    .mark { width:40px; height:40px; border-radius:50%; }
    .wordmark { font-family:Arial,sans-serif; font-size:1.08rem; font-weight:700; letter-spacing:-.03em; }
    .wordmark span { color:var(--orange); }
    .wordmark .tld { color:var(--ink); font-weight:700; font-size:.86em; }
    .navs { display:flex; gap:1rem; align-items:center; }
    .nav { font-family:Arial,sans-serif; font-size:.68rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; text-decoration:none; color:var(--orange); }
    main { flex:1; width:100%; max-width:44rem; margin:0 auto; padding:2.6rem 1.5rem 2.75rem; display:flex; }
    .panel { background:#fff; border:1px solid #e8e8e8; border-top:3px solid var(--orange); border-radius:12px; padding:1.75rem 1.7rem 1.55rem; width:100%; max-width:24rem; margin:0 auto; }
    .kicker { font-family:Arial,sans-serif; font-size:.64rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--orange); margin-bottom:.35rem; }
    h1 { font-family:Arial,sans-serif; font-size:1.45rem; font-weight:800; letter-spacing:-.03em; margin-bottom:.45rem; }
    p { font-size:.98rem; line-height:1.55; color:var(--mute); margin-bottom:1rem; }
    label { display:block; font-family:Arial,sans-serif; font-size:.68rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#8a847a; margin:0 0 .35rem; }
    input {
      width:100%; height:2.35rem; margin-bottom:.85rem; padding:0 .75rem;
      border:1px solid #e6e6e6; border-radius:8px; background:#f7f4ee;
      font-family:Georgia,serif; font-size:1rem; color:var(--ink);
    }
    input:focus { outline:none; border-color:var(--orange); background:#fff; }
    button {
      width:100%; height:2.4rem; border:0; border-radius:8px;
      background:var(--orange); color:#fff;
      font-family:Arial,sans-serif; font-size:.72rem; font-weight:800;
      letter-spacing:.14em; text-transform:uppercase; cursor:pointer;
    }
    .alt { margin-top:1rem; font-size:.92rem; }
    .alt a { color:var(--orange); text-decoration:none; font-weight:700; }
    footer { border-top:1px solid var(--line); padding:1rem 1.5rem 1.3rem; font-family:Arial,sans-serif; font-size:.72rem; color:#8a8a8a; background:#fff; }
    footer .inner { max-width:44rem; margin:0 auto; display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    .law-btn { color:var(--orange); text-decoration:none; font-weight:800; letter-spacing:.12em; text-transform:uppercase; font-size:.68rem; }
</style>
